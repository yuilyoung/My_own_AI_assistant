[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "my-own-ai-assistant"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff==0.17.3"]

[project.scripts]
my-assistant = "gateway.cli:main"

[tool.setuptools]
package-dir = {"" = "services"}

[tool.setuptools.packages.find]
where = ["services"]
include = ["gateway*"]
exclude = ["*.tests*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/gateway/tests"]
pythonpath = ["services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
