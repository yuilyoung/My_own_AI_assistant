[build-system]
requires = ["setuptools==82.0.1"]
build-backend = "setuptools.build_meta"

[project]
name = "my-own-ai-assistant"
version = "0.2.0"
description = "Local-first voice assistant and companion engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "ruff>=0.9,<1"]

[project.scripts]
my-assistant = "gateway.cli:main"

[tool.setuptools]
packages = ["gateway", "gateway_ui"]
package-dir = {gateway = "services/gateway", gateway_ui = "apps/diagnostics"}
include-package-data = false

[tool.setuptools.package-data]
gateway_ui = ["*.html", "*.css", "*.mjs"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["services/gateway/tests"]
pythonpath = ["services"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
files = ["services/gateway"]
exclude = ["services/gateway/tests/"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
branch = true
source = ["gateway"]
omit = ["*/tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 85
