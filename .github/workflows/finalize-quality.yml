name: One-time final quality baseline
on:
  push:
    branches: [feat/ci-quality-artifacts]
    paths: [.github/workflows/finalize-quality.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'yuilyoung/My_own_AI_assistant' && github.ref == 'refs/heads/feat/ci-quality-artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/ci-quality-artifacts
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-ci.txt
      - name: Upgrade unsupported lint baseline and regenerate exact lockfile
        run: npm install --save-dev --save-exact --ignore-scripts eslint@10.13.0 @eslint/js@10
      - name: Apply reviewed type narrowing and update tool commands
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('services/gateway/api.py')
          text = p.read_text()
          start = text.index('    recognizer = (')
          end = text.index('    transcriptions =', start)
          replacement = '\n'.join([
              '    recognizer = None',
              '    if settings.stt == "whisper_cpp":',
              '        cli, model = settings.whisper_cli, settings.whisper_model',
              '        if cli is None or model is None:',
              '            raise ValueError("Local STT requires an executable and a model")',
              '        recognizer = WhisperCpp(',
              '            cli, model, settings.data_dir / partition / "stt-tmp", settings.timeout',
              '        )',
              '',
          ])
          p.write_text(text[:start] + replacement + text[end:])
          p = Path('services/gateway/transcription.py')
          text = p.read_text()
          old = '                text = await self.provider.transcribe(data)'
          assert text.count(old) == 1
          new = '\n'.join([
              '                provider = self.provider',
              '                if provider is None:',
              '                    raise ValueError("STT provider is disabled")',
              '                text = await provider.transcribe(data)',
          ])
          p.write_text(text.replace(old, new))
          p = Path('package.json')
          data = json.loads(p.read_text())
          data['engines']['node'] = '>=22.13.0'
          data['scripts']['test:ci'] = 'node --test --experimental-test-coverage --test-coverage-exclude="**/tests/**" --test-reporter=junit --test-reporter-destination=reports/javascript-junit.xml --test-reporter=lcov --test-reporter-destination=reports/javascript-coverage.lcov'
          p.write_text(json.dumps(data, indent=2) + '\n')
          p = Path('README.md')
          text = p.read_text()
          assert '## CI/CD' not in text
          text += '\n## CI/CD\n\nRuff/Prettier 포맷 검사, Ruff/ESLint 린트, mypy 타입 검사, Bandit 보안 정적 분석을 실행합니다. Windows·Ubuntu 및 Python 3.11·3.13에서 테스트하고, 생성한 패키지를 깨끗한 환경에 설치해 HTTP로 검증합니다.\n\n검증을 통과한 wheel·소스 배포 파일·로컬 실행 ZIP과 SHA-256 체크섬을 GitHub Actions Artifact로 보관합니다. ZIP은 Python과 인터넷 연결이 필요한 설치 묶음이며 단독 실행 EXE가 아닙니다. 버전 태그는 검증 후 초안 Release만 생성하며 서버 자동 배포는 하지 않습니다.\n\n[CI/CD 구조, 산출물, 로컬 검사 명령](docs/ci-cd.md)\n'
          p.write_text(text)
          PY
      - run: npm install --package-lock-only --ignore-scripts
      - run: python -m ruff check --select I --fix .
      - run: python -m ruff format .
      - run: npm run format
      - run: python -m ruff check .
      - run: python -m mypy
      - run: npm run lint
      - run: python -m pytest -q
      - run: npm test
      - name: Commit checked baseline and delete one-time workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/finalize-quality.yml
          git add --update
          git diff --cached --stat
          git commit -m 'fix: narrow provider types and finalize supported quality baseline'
          git push origin HEAD:refs/heads/feat/ci-quality-artifacts
