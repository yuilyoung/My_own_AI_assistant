name: Format avatar binding PR files (temporary)
on:
  push:
    branches:
      - feat/avatar-semantic-bindings-20261104
    paths:
      - '.github/workflows/format-avatar-pr.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install pinned frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Apply locked Prettier
        working-directory: apps/web
        run: npx prettier --write src/AvatarBindingEditor.tsx src/AvatarInspector.test.tsx
      - name: Commit formatting
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/AvatarBindingEditor.tsx apps/web/src/AvatarInspector.test.tsx
          if ! git diff --cached --quiet; then
            git commit -m 'style(avatar): format semantic bindings with pinned Prettier'
            git push origin HEAD:feat/avatar-semantic-bindings-20261104
          fi
