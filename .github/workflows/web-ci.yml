name: Web frontend CI
on:
  push:
    paths:
      - 'apps/web/**'
      - 'apps/diagnostics/**'
      - 'services/**'
      - 'scripts/react_smoke.py'
      - 'scripts/portrait_proportions.py'
      - 'scripts/portrait_joints.js'
      - 'docs/design/*-original.png'
      - 'docs/design/*-original.webp'
      - 'scripts/windows_smoke.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/diagnostics/**'
      - 'services/**'
      - 'scripts/react_smoke.py'
      - 'scripts/portrait_proportions.py'
      - 'scripts/portrait_joints.js'
      - 'docs/design/*-original.png'
      - 'docs/design/*-original.webp'
      - 'scripts/windows_smoke.py'
      - 'requirements*.txt'
      - 'pyproject.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - '.github/workflows/web-ci.yml'
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Formatter
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Unit and React integration tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - name: Reject private Cubism exports in public web artifact
        run: |
          if [ -e dist/avatar-local ]; then
            echo "Refusing to ship private /avatar-local assets in web-dist or Docker" >&2
            exit 1
          fi
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        working-directory: .
        run: |
          python -m pip install -r requirements-dev.txt playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Production browser smoke with synthetic voice providers
        working-directory: .
        run: python scripts/react_smoke.py
      - name: Build deployable Docker image including shared voice modules
        working-directory: .
        run: docker build --tag assistant-ci .
      - name: Smoke test packaged Docker API and public Host guard
        working-directory: .
        run: |
          docker run --rm --entrypoint python assistant-ci -c '
          from fastapi.testclient import TestClient
          from gateway.api import create_app
          from gateway.config import Settings

          settings = Settings(token="x" * 64, host="0.0.0.0", public_origin="https://assistant.example")
          app = create_app(settings)
          with TestClient(app, base_url=settings.public_origin) as client:
              assert client.get("/").status_code == 200
              assert client.get("/api/status").status_code == 401
              client.headers["Authorization"] = "Bearer " + settings.token
              assert client.get("/api/status").json()["deployment"] == "cloud"
          with TestClient(
              app, base_url="http://localhost:8765", client=("203.0.113.10", 50000)
          ) as remote:
              assert remote.get("/").status_code == 400
          print("Packaged Docker API smoke passed")
          '
      - name: Upload static build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist/
          if-no-files-found: error

  windows-production-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Install locked frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Build production React application
        working-directory: apps/web
        run: npm run build
      - name: Reject private Cubism exports in Windows web build
        run: |
          if (Test-Path "apps/web/dist/avatar-local") {
            throw "Private /avatar-local assets must not be bundled in the static build"
          }
      - name: Install Gateway dependencies
        run: python -m pip install -r requirements.txt
      - name: Check Windows local readiness CLI (demo, no inference)
        run: |
          $env:PYTHONPATH = "services"
          python -m gateway.readiness_cli --provider demo --json
      - name: Start real Windows Gateway and verify production API / assets
        run: python scripts/windows_smoke.py
      - name: Install Chromium for Windows synthetic voice E2E
        run: |
          python -m pip install playwright==1.64.1
          python -m playwright install chromium
      - name: Exercise React microphone, transcript review and audio playback in Windows Chromium
        env:
          SMOKE_REPORT_PATH: ${{ runner.temp }}/windows-voice-smoke.json
        run: python scripts/react_smoke.py
      - name: Preserve Windows synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-synthetic-voice-report
          path: ${{ runner.temp }}/windows-voice-smoke.json
          if-no-files-found: warn
