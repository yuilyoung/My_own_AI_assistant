name: Web frontend CI
on:
  push:
    paths:
      - 'apps/web/**'
      - 'apps/diagnostics/**'
      - 'services/**'
      - 'scripts/react_smoke.py'
      - 'scripts/windows_smoke.py'
      - 'requirements*.txt'
      - '.github/workflows/web-ci.yml'
  pull_request:
    paths:
      - 'apps/web/**'
      - 'apps/diagnostics/**'
      - 'services/**'
      - 'scripts/react_smoke.py'
      - 'scripts/windows_smoke.py'
      - 'requirements*.txt'
      - '.github/workflows/web-ci.yml'
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Formatter
        run: npm run format:check
      - name: Diagnose formatter differences (temporary)
        if: failure()
        run: |
          npx --no-install prettier --write src/AvatarInspector.tsx src/model3.ts
          git diff -- src/AvatarInspector.tsx src/model3.ts
      - name: Lint
        run: npm run lint
      - name: Unit and React integration tests
        run: npm test
      - name: Typecheck and production build
        run: npm run build
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser test dependencies
        working-directory: .
        run: |
          python -m pip install -r requirements-dev.txt playwright==1.64.1
          python -m playwright install --with-deps chromium
      - name: Production browser smoke with synthetic voice providers
        working-directory: .
        run: python scripts/react_smoke.py
      - name: Upload static build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          if-no-files-found: error

  windows-production-smoke:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install locked frontend dependencies
        working-directory: apps/web
        run: npm ci --no-audit --no-fund
      - name: Build production React application
        working-directory: apps/web
        run: npm run build
      - name: Install Gateway dependencies
        run: python -m pip install -r requirements.txt
      - name: Start real Windows Gateway and verify production API / assets
        run: python scripts/windows_smoke.py
