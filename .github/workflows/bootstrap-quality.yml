name: One-time quality baseline preparation
on:
  push:
    branches: [feat/ci-quality-artifacts]
    paths: [.github/workflows/bootstrap-quality.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'yuilyoung/My_own_AI_assistant' && github.ref == 'refs/heads/feat/ci-quality-artifacts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: feat/ci-quality-artifacts
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-ci.txt
      - run: npm install --package-lock-only --ignore-scripts
      - run: npm ci --ignore-scripts
      - run: python -m ruff check --select I --fix .
      - run: python -m ruff format .
      - run: npm run format
      - name: Commit the one-time formatting baseline and remove this workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/bootstrap-quality.yml
          git add --update
          git add package-lock.json
          git diff --cached --stat
          git commit -m 'style: apply pinned formatters and lock JavaScript tooling'
          git push origin HEAD:refs/heads/feat/ci-quality-artifacts
      - name: Report remaining static-check findings
        if: always()
        run: |
          set +e
          python -m ruff check .
          python -m mypy --check-untyped-defs services/gateway --exclude tests
          python -m bandit -r services/gateway workers -x services/gateway/tests -ll
          npm run lint
          exit 0
