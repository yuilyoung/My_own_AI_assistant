name: Temporary format PR 6
on:
  push:
    branches:
      - feat/local-cubism-adapter-20261103
    paths:
      - '.github/workflows/_format-pr6.yml'
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/local-cubism-adapter-20261103
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies and format changed TypeScript
        working-directory: apps/web
        run: |
          npm ci --no-audit --no-fund
          npx prettier --write src/App.tsx src/AvatarInspector.tsx src/AvatarInspector.test.tsx src/licensed-avatar.ts
      - name: Commit formatting only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/App.tsx apps/web/src/AvatarInspector.tsx apps/web/src/AvatarInspector.test.tsx apps/web/src/licensed-avatar.ts
          if ! git diff --cached --quiet; then
            git commit -m "style(web): apply Prettier to licensed avatar integration"
            git push origin HEAD:feat/local-cubism-adapter-20261103
          fi
