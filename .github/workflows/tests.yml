name: Local engine tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: node --test apps/diagnostics/tests/core.test.mjs apps/diagnostics/tests/player.test.mjs apps/diagnostics/tests/voice.test.mjs apps/diagnostics/tests/capture.test.mjs

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements-dev.txt
      - name: Python lint and static analysis
        run: python -m ruff check services workers scripts
      - name: Python formatter
        run: python -m ruff format --check services workers scripts
      - name: Build Gateway wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-wheel
          path: dist/*.whl
          if-no-files-found: error
