name: CI quality, tests and packages
on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
defaults:
  run:
    shell: bash
jobs:
  quality:
    name: Format, lint, types and security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-ci.txt
      - run: npm ci --ignore-scripts
      - run: python -c "from pathlib import Path; Path('reports').mkdir(exist_ok=True)"
      - name: Python formatting (check only)
        run: python -m ruff format --check .
      - name: Python lint and import order
        run: python -m ruff check . --output-format=github
      - name: Python type analysis
        run: python -m mypy
      - name: Python security analysis (medium and high severity)
        run: python -m bandit -r services/gateway workers -x services/gateway/tests -ll -f json -o reports/bandit.json
      - name: Web formatting (check only)
        run: npm run format:check
      - name: Web lint
        run: npm run lint
      - name: Preserve static analysis report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: quality-report
          path: reports/
          retention-days: 14
          if-no-files-found: warn
  test:
    name: Tests (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: 'requirements*.txt'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - id: dependencies
        run: |
          python -m pip install -r requirements-dev.txt pytest-cov==7.0.0
          python -c "from pathlib import Path; Path('reports').mkdir(exist_ok=True)"
      - name: Python tests with branch coverage (85% minimum)
        run: python -m pytest -q --junitxml=reports/python-junit.xml --cov=gateway --cov-branch --cov-report=xml:reports/coverage.xml --cov-report=html:reports/coverage-html --cov-report=term-missing
      - name: JavaScript tests with JUnit and LCOV reports
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: npm run test:ci
      - name: Preserve test reports even on failure
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: tests-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn
  build:
    name: Build wheel, source and runtime bundle
    needs: [quality, test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - run: python -m pip install build==1.3.0 twine==6.2.0
      - name: Build sdist, then wheel from sdist
        run: python -m build
      - name: Validate distribution metadata
        run: python -m twine check --strict dist/*
      - run: python scripts/package_release.py
      - run: python scripts/package_release.py --verify
      - name: Transfer candidate for installation verification (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: candidate-${{ github.sha }}
          path: dist/
          retention-days: 1
          if-no-files-found: error
  install:
    name: Installed smoke (${{ matrix.os }}, Python ${{ matrix.python }})
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-${{ github.sha }}
          path: dist
      - run: python scripts/package_release.py --verify
      - name: Clean venv installation (no editable or source imports)
        run: |
          python -m zipfile -e dist/*-runtime.zip runtime-check
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -File runtime-check/install.ps1
            PY=runtime-check/.venv/Scripts/python.exe
          else
            sh runtime-check/install.sh
            PY=runtime-check/.venv/bin/python
          fi
          "$PY" -m pip check
          python scripts/smoke_installed.py --python "$PY" --report reports/installed-smoke.json
      - name: Preserve installation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: install-${{ matrix.os }}-py${{ matrix.python }}
          path: reports/
          retention-days: 14
          if-no-files-found: warn
  artifacts:
    name: Publish verified distribution artifact
    needs: [build, install]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: candidate-${{ github.sha }}
          path: dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: distribution-${{ github.sha }}
          path: dist/
          retention-days: 30
          if-no-files-found: error
  gate:
    name: CI gate
    if: always()
    needs: [quality, test, build, install, artifacts]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Reject failed, cancelled or skipped prerequisites
        env:
          QUALITY: ${{ needs.quality.result }}
          TESTS: ${{ needs.test.result }}
          BUILD: ${{ needs.build.result }}
          INSTALL: ${{ needs.install.result }}
          ARTIFACTS: ${{ needs.artifacts.result }}
        run: |
          test "$QUALITY" = success
          test "$TESTS" = success
          test "$BUILD" = success
          test "$INSTALL" = success
          test "$ARTIFACTS" = success
  release:
    name: Draft release for a verified version tag
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
    needs: gate
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: distribution-${{ github.sha }}
          path: dist
      - name: Verify tag, checksums and main ancestry without rebuilding
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          git merge-base --is-ancestor HEAD origin/main
          python scripts/package_release.py --verify --tag "$RELEASE_TAG"
      - name: Create draft only (never deploy or publish automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/* --draft --verify-tag --title "$RELEASE_TAG" --generate-notes
